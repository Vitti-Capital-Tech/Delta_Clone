<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delta Demo – Futures & Options</title>
<link rel="preconnect" href="https://api.india.delta.exchange">
<link rel="preconnect" href="https://socket.india.delta.exchange">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
<script src="js/vendor/lwc.js"></script>
</head>
<body>
<header class="top">
  <div class="logo"><img src="assets/favicon.svg" width="28" height="28" alt="Delta"><b>delta</b><span class="tag">DEMO</span></div>
  <nav id="nav"><a data-view="futures" class="on">Futures</a><a data-view="options">Options</a></nav>
  <div class="sp"></div>
  <div id="feedWarn" class="feedwarn hidden"></div>
  <div id="hdrAcct" class="hdr-acct"></div>
</header>

<div class="shell">
<div class="main">
<section class="tickerbar">
  <div id="chips" class="chips"></div>
  <button id="symBtn" class="symbtn"></button>
  <div id="symPicker" class="picker hidden">
    <input id="symSearch" placeholder="Search markets" autocomplete="off">
    <div class="phead"><span>Market</span><span>Price</span><span>24h</span></div>
    <div id="symList"></div>
  </div>
  <div id="stats" class="stats"></div>
</section>

<main class="grid">
  <section class="panel chart-panel">
    <div class="ptools" id="chartTools"><div id="resBar" class="resbar"></div><div class="sp"></div><div id="chartOpts" class="resbar"></div></div>
    <div id="chartWrap" class="chartwrap"><div id="legend" class="legend"></div><div id="chart"></div></div>
    <div id="chain" class="chain hidden"></div>
  </section>

  <section class="panel book-panel">
    <div class="tabs" id="bookTabs"><a data-t="book" class="on">Order Book</a><a data-t="trades">Recent Trades</a></div>
    <div id="bookView"></div>
    <div id="tradesView" class="hidden"></div>
  </section>

  <section class="panel order-panel" id="orderPanel"></section>

  <section class="panel bottom-panel">
    <div class="tabs" id="botTabs"></div>
    <div id="botView" class="tbl-wrap"></div>
  </section>
</main>
</div></div>

<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>
<div id="toasts"></div>

<script src="js/config.js"></script>
<script src="js/feed.js"></script>
<script src="js/engine.js"></script>
<script src="js/client.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
